{% extends 'todo/base.html' %}

{% block content %}
<h1>{% if task.pk or form.instance.pk %}Update Task{% else %}Create Task{% endif %}</h1>

{% if error %}
    <div class="alert alert-danger" role="alert">
        {{ error }}
    </div>
{% endif %}

<form method="POST">
    {% csrf_token %}
    <div class="mb-3">
        <label class="form-label" for="id_title">Title</label>
        <input type="text" id="id_title" class="form-control" name="title" value="{{ task.title }}">
    </div>

    <div class="mb-3">
        <label class="form-label" for="id_description">Description</label>
        <textarea id="id_description" class="form-control" name="description">{{ task.description}}</textarea>
    </div>

    <button type="submit" class="btn btn-primary">
        {% if task.pk or form.instance.pk %}Update{% else %}Create{% endif %}
    </button>
    <a class="btn btn-secondary" href="{% url 'todo:task_list' %}">Cancel</a>
</form>
{% endblock %}
