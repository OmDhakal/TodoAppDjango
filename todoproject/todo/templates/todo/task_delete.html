{% extends 'todo/base.html' %}
{% block content %}
<h1>Delete task</h1>
<p>Are you sure you want to delete {{ task.title }}?</p>
<form method="POST">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Delete</button>
    <a class="btn btn-secondary" href="{% url 'todo:task_list' %}">Cancel</a>
</form>
{% endblock %}
